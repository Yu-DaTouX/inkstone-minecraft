# 推一个 v* 标签（版本号要和 package.json 一致）就打 Windows 安装包并发到 GitHub Releases。
# 启动器的自动更新读的就是这里的 latest.yml。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run dist
      - run: npm run verify:release
      - name: Upload verified release assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = "v$releaseVersion"
          if ($env:GITHUB_REF_NAME -ne $releaseTag) { throw "Tag does not match package version" }
          $releaseNotes = "docs/releases/$releaseVersion.md"
          if (!(Test-Path -LiteralPath $releaseNotes)) { throw "Missing release notes" }
          gh release create $releaseTag --verify-tag --draft --title "Inkstone Minecraft $releaseVersion" --notes-file $releaseNotes "dist/Inkstone-Minecraft-Setup-$releaseVersion.exe" "dist/Inkstone-Minecraft-Setup-$releaseVersion.exe.blockmap" "dist/latest.yml"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh release edit $releaseTag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
